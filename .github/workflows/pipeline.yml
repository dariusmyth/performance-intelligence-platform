name: Performance Intelligence Platform

on:
  push:
    branches:
      - main
    paths-ignore:
      - "results/**"

  workflow_dispatch:

jobs:
  performance-test:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # --------------------------------------------------
      # Checkout repo
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # Install JMeter (fixed version)
      # --------------------------------------------------
      - name: Install JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          echo "$PWD/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH

      - name: Verify JMeter
        run: jmeter --version

      # --------------------------------------------------
      # Generate RUN_ID
      # --------------------------------------------------
      - name: Create RUN_ID
        run: |
          echo "RUN_ID=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

      # --------------------------------------------------
      # Generate JMX from Postman
      # --------------------------------------------------
      - name: Generate JMX Test Plan
        run: |
          python scripts/generate_jmx.py $RUN_ID

      # --------------------------------------------------
      # Commit generated JMX (IMPORTANT)
      # --------------------------------------------------
      - name: Commit JMX
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add jmx/

          git commit -m "perf: generated JMX for $RUN_ID" || echo "No JMX changes"

          git push

      # --------------------------------------------------
      # Run JMeter test (includes HTML report generation)
      # --------------------------------------------------
      - name: Run JMeter Load Test
        run: |
          python scripts/run_jmeter.py $RUN_ID

      # --------------------------------------------------
      # Parse JTL results → metrics.json
      # --------------------------------------------------
      - name: Parse Results
        run: |
          python scripts/parse_jtl.py $RUN_ID

      # --------------------------------------------------
      # Generate Dashboard
      # --------------------------------------------------
      - name: Generate Dashboard
        run: |
          python scripts/generate_dashboard.py

      # --------------------------------------------------
      # Generate Historical Dashboard
      # --------------------------------------------------
      - name: Generate Historical Dashboard
        run: |
          python scripts/generate_history_dashboard.py

      # --------------------------------------------------
      # Commit results (JTL + dashboards + reports)
      # --------------------------------------------------
      - name: Commit Results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add results/

          git commit -m "perf: results for $RUN_ID" || echo "No results to commit"

          git push
name: Performance Intelligence Platform

on:
  push:
    branches:
      - main
    paths-ignore:
      - "results/**"

  workflow_dispatch:

jobs:
  performance-test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # -------------------------
      # Checkout code
      # -------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------
      # Setup Python
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      # -------------------------
      # Install JMeter (fixed version)
      # -------------------------
      - name: Install JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          echo "$PWD/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH

      - name: Verify JMeter Installation
        run: |
          jmeter --version

      # -------------------------
      # Generate Run ID
      # -------------------------
      - name: Create Run ID
        run: |
          echo "RUN_ID=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

      # -------------------------
      # Generate JMX from Postman
      # -------------------------
      - name: Generate JMX Test Plan
        run: |
          python scripts/generate_jmx.py

      # -------------------------
      # Run JMeter Tests
      # -------------------------
      - name: Run JMeter Load Test
        run: |
          python scripts/run_jmeter.py $RUN_ID

      # -------------------------
      # Generate JMeter HTML Report (native)
      # -------------------------
      - name: Generate JMeter HTML Report
        run: |
          mkdir -p results/$RUN_ID/jmeter-report

          jmeter \
            -g results/$RUN_ID/results.jtl \
            -o results/$RUN_ID/jmeter-report

      # -------------------------
      # Parse JTL → Metrics JSON
      # -------------------------
      - name: Parse JMeter Results
        run: |
          python scripts/parse_jtl.py $RUN_ID

      # -------------------------
      # Generate Dashboard (Business UI)
      # -------------------------
      - name: Generate Dashboard
        run: |
          python scripts/generate_dashboard.py

      # -------------------------
      # Generate Historical Dashboard
      # -------------------------
      - name: Generate Historical Dashboard
        run: |
          python scripts/generate_history_dashboard.py

      # -------------------------
      # Commit Results Back to Repo
      # -------------------------
      - name: Commit Results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add results/

          git commit -m "perf: run $RUN_ID" || echo "No changes to commit"

          git push
name: Performance Pipeline

on:
  push:
    paths-ignore:
      - "results/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Install JMeter
        run: sudo apt-get update && sudo apt-get install -y jmeter

      - name: Generate JMX
        run: python scripts/generate_jmx.py

      - name: Run JMeter
        id: run
        run: |
          RUN_ID=$(python scripts/run_jmeter.py)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Parse JTL
        run: python scripts/parse_jtl.py $RUN_ID

      - name: Generate AI Report
        run: python scripts/generate_business_report.py

      - name: Generate Dashboard
        run: python scripts/generate_dashboard.py

      - name: Generate History Dashboard
        run: python scripts/generate_history_dashboard.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add results/
          git commit -m "perf: run $RUN_ID" || exit 0
          git push
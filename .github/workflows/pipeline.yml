name: Performance Intelligence Platform

on:
  push:
    branches:
      - main
    paths-ignore:
      - "results/**"

  workflow_dispatch:

jobs:
  performance-test:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          echo "$PWD/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH

      - name: Verify JMeter
        run: jmeter --version

      - name: Create RUN_ID
        run: echo "RUN_ID=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

      # -------------------------
      # Generate JMX (versioned)
      # -------------------------
      - name: Generate JMX
        run: |
          python scripts/generate_jmx.py $RUN_ID

      # -------------------------
      # Commit JMX
      # -------------------------
      - name: Commit JMX
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add jmx/

          git commit -m "perf: JMX for $RUN_ID" || echo "no changes"

          git push

      # -------------------------
      # Run JMeter + HTML report
      # -------------------------
      - name: Run JMeter
        run: |
          python scripts/run_jmeter.py $RUN_ID

      # -------------------------
      # Parse results
      # -------------------------
      - name: Parse JTL
        run: |
          python scripts/parse_jtl.py $RUN_ID

      # -------------------------
      # Dashboards
      # -------------------------
      - name: Generate Dashboard
        run: |
          python scripts/generate_dashboard.py

      - name: Generate History Dashboard
        run: |
          python scripts/generate_history_dashboard.py

      # -------------------------
      # Commit results
      # -------------------------
      - name: Commit Results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add results/

          git commit -m "perf: results for $RUN_ID" || echo "no changes"

          git push